# Online Boutique in acme's uk dev cluster, namespace boutique, from this repo's Helm chart (identical to upstream
# v0.10.7; the fork has no tags, so the commit is pinned). The release limits (128Mi for several services) OOM-kill
# on a busy laptop, so the services that ran out get more memory and the slow starters more CPU. No LoadBalancer
# locally (Kind has none, and ArgoCD would wait for its address): reach the shop with a port-forward to service
# frontend.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique
  namespace: applications
spec:
  project: owner
  source:
    repoURL: git@github.com:thesoftwaregeek/microservices-demo.git
    targetRevision: c7cb6d5bfd6ea3aed768634ebbcb98cb7a523712
    path: helm-chart
    helm:
      releaseName: boutique
      valuesObject:
        frontend:
          externalService: false
        cartService:
          resources:
            requests: {cpu: 200m, memory: 128Mi}
            limits: {cpu: "1", memory: 512Mi}
        currencyService:
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
        paymentService:
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
        emailService:
          resources:
            requests: {cpu: 100m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
        recommendationService:
          resources:
            requests: {cpu: 100m, memory: 220Mi}
            limits: {cpu: 500m, memory: 450Mi}
        adService:
          resources:
            requests: {cpu: 200m, memory: 180Mi}
            limits: {cpu: "1", memory: 512Mi}
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
