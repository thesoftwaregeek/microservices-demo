# Online Boutique's paymentservice in acme's uk dev cluster, namespace boutique: one Application per service.
# It installs the chart boutique-paymentservice from oci://ghcr.io/thesoftwaregeek/charts as release
# boutique, so the object names stay. The image is ghcr.io/thesoftwaregeek/boutique/paymentservice, built and
# signed from the tag paymentservice-<version> in this repo; the chart version moves with it.
# The upstream release limits OOM-kill on a busy laptop, so the resources here are raised.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-paymentservice
  namespace: applications
spec:
  project: owner
  source:
    repoURL: ghcr.io/thesoftwaregeek/charts
    chart: boutique-paymentservice
    targetRevision: 0.1.1
    helm:
      releaseName: boutique
      valuesObject:
        resources:
          requests:
            cpu: 100m
            memory: 64Mi
          limits:
            cpu: 500m
            memory: 256Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
