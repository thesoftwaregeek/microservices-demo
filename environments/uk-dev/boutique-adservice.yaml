# Online Boutique's adservice in acme's uk dev cluster, namespace boutique: one Application per service.
# It installs the chart boutique-adservice from oci://ghcr.io/thesoftwaregeek/charts as release
# boutique, so the object names stay. The image is ghcr.io/thesoftwaregeek/boutique/adservice, built and
# signed from the tag adservice-<version> in this repo; the chart version moves with it.
# The upstream release limits OOM-kill on a busy laptop, so the resources here are raised.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-adservice
  namespace: applications
spec:
  project: owner
  source:
    repoURL: ghcr.io/thesoftwaregeek/charts
    chart: boutique-adservice
    targetRevision: 0.1.0
    helm:
      releaseName: boutique
      valuesObject:
        resources:
          requests:
            cpu: 200m
            memory: 180Mi
          limits:
            cpu: "1"
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
