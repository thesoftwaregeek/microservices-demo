# Online Boutique's productcatalogservice in acme's uk dev cluster, namespace boutique: one Application per service.
# It installs the chart boutique-productcatalogservice from oci://ghcr.io/thesoftwaregeek/charts as release
# boutique, so the object names stay. The image is ghcr.io/thesoftwaregeek/boutique/productcatalogservice, built and
# signed from the tag productcatalogservice-<version> in this repo; the chart version moves with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-productcatalogservice
  namespace: applications
spec:
  project: owner
  source:
    repoURL: ghcr.io/thesoftwaregeek/charts
    chart: boutique-productcatalogservice
    targetRevision: 0.1.2
    helm:
      releaseName: boutique
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
