# Online Boutique's frontend in acme's uk dev cluster, namespace boutique: one Application per service.
# It installs the chart boutique-frontend from oci://ghcr.io/thesoftwaregeek/charts as release
# boutique, so the object names stay. The image is ghcr.io/thesoftwaregeek/boutique/frontend, built and
# signed from the tag frontend-<version> in this repo; the chart version moves with it.
# externalService is off: Kind has no LoadBalancer, and ArgoCD would wait for its address. Reach the shop
# with a port-forward to service frontend.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-frontend
  namespace: applications
spec:
  project: owner
  source:
    repoURL: ghcr.io/thesoftwaregeek/charts
    chart: boutique-frontend
    targetRevision: 0.1.1
    helm:
      releaseName: boutique
      valuesObject:
        externalService: false
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
