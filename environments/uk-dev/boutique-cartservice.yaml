# Online Boutique's cartservice in acme's uk dev cluster, namespace boutique: one Application per service.
# It installs the chart boutique-cartservice from oci://ghcr.io/thesoftwaregeek/charts as release
# boutique, so the object names stay. The image is ghcr.io/thesoftwaregeek/boutique/cartservice, built and
# signed from the tag cartservice-<version> in this repo; the chart version moves with it.
# The upstream release limits OOM-kill on a busy laptop, so the resources here are raised.
# The chart also owns redis-cart (its Deployment, Service and ServiceAccount), so redis-cart exists exactly once, here.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: boutique-cartservice
  namespace: applications
spec:
  project: owner
  source:
    repoURL: ghcr.io/thesoftwaregeek/charts
    chart: boutique-cartservice
    targetRevision: 0.1.0
    helm:
      releaseName: boutique
      valuesObject:
        resources:
          requests:
            cpu: 200m
            memory: 128Mi
          limits:
            cpu: "1"
            memory: 512Mi
  destination:
    server: https://kubernetes.default.svc
    namespace: boutique
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
