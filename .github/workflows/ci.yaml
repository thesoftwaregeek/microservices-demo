name: CI
permissions: {}

# Unit tests (Go and C#). Run on pull requests and pushes to main, and as the first job of the release workflow.
on:
  pull_request:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  push:
    branches:
      - main
    paths-ignore:
      - "**/*.md"
      - "docs/**"
      - "LICENSE"
  workflow_call:

# Only the most recent commit of a pull request is tested.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  code-tests:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6
        env:
          DOTNET_INSTALL_DIR: "./.dotnet"
        with:
          dotnet-version: "10.0"
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5 # v7
        with:
          go-version: "1.27"
      - name: Go Unit Tests
        timeout-minutes: 10
        run: |
          for GO_PACKAGE in "shippingservice" "productcatalogservice" "frontend/validator"; do
            echo "Testing $GO_PACKAGE..."
            pushd "src/$GO_PACKAGE"
            go test
            popd
          done
      - name: C# Unit Tests
        timeout-minutes: 10
        run: dotnet test src/cartservice/
