name: Release
permissions: {}

# Publishes one service's image for a tag <service>-<version> (for example cartservice-0.1.0) to
# <registry>/boutique/<service>:<version>, for linux/amd64 and linux/arm64, and signs it with cosign (keyless, this
# workflow's identity). The registry is vars.PACKAGE_REGISTRY, default ghcr.io/<owner>. A version that already
# exists is never overwritten. Run workflow_dispatch from the tag itself ("Use workflow from"), not a branch: the
# signature records the ref the run started from.
# Note: the helm-charts mirror gate (VENDOR_REPOS) accepts only tags matching v<semver> today; see the README.

on:
  push:
    tags:
      - "*-[0-9]*.[0-9]*.[0-9]*" # <service>-<version>; the first step rejects anything that is not exactly that
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to publish, <service>-<version>, e.g. cartservice-0.1.0
        type: string
        required: true

jobs:
  test:
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write # push to ghcr.io/<owner>
      id-token: write # keyless cosign signing
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
      REGISTRY: ${{ vars.PACKAGE_REGISTRY || format('ghcr.io/{0}', github.repository_owner) }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.tag || github.ref }}

      # Splits the tag into the service and the version and finds the Dockerfile's build context. Only the services
      # the platform runs are accepted (shoppingassistantservice is not one of them).
      - name: Parse the tag
        id: parse
        run: |
          if [[ ! "$TAG" =~ ^([a-z]+)-([0-9]+[.][0-9]+[.][0-9]+)$ ]]; then
            echo "::error::tag '$TAG' is not <service>-<major>.<minor>.<patch>"
            exit 1
          fi
          service="${BASH_REMATCH[1]}"
          case "$service" in
          adservice | checkoutservice | currencyservice | emailservice | frontend | loadgenerator | paymentservice | \
            productcatalogservice | recommendationservice | shippingservice)
            context="src/$service"
            ;;
          cartservice)
            context="src/cartservice/src" # its Dockerfile is beside the project, not at the service root
            ;;
          *)
            echo "::error::unknown service '$service'"
            exit 1
            ;;
          esac
          {
            echo "service=$service"
            echo "version=${BASH_REMATCH[2]}"
            echo "context=$context"
          } >>"$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@29109295f81e9208d7d86ff1c6c12d2833863392 # v3.6.0

      - name: Set up Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Log in to GHCR
        if: startsWith(env.REGISTRY, 'ghcr.io/')
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Refuse to overwrite a published version
        env:
          IMAGE: ${{ env.REGISTRY }}/boutique/${{ steps.parse.outputs.service }}:${{ steps.parse.outputs.version }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "::error::$IMAGE already exists"
            exit 1
          fi

      - name: Build and push
        id: build
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        with:
          context: ${{ steps.parse.outputs.context }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ env.REGISTRY }}/boutique/${{ steps.parse.outputs.service }}:${{ steps.parse.outputs.version }}

      # The mirror's gate does not cover the vendor's own images, so the release applies the same rule: a fixable
      # CRITICAL vulnerability fails it before the image is signed.
      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # 0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/boutique/${{ steps.parse.outputs.service }}@${{ steps.build.outputs.digest }}
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Sign
        env:
          IMAGE: ${{ env.REGISTRY }}/boutique/${{ steps.parse.outputs.service }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "$IMAGE@$DIGEST"
