# shop in the portal's catalog: backfilled to match the "New application" template. One System per application
# (whatever environments run it), one Component or Resource per component.
apiVersion: backstage.io/v1alpha1
kind: System
metadata:
  name: acme-shop
  title: shop
  description: An Application of the acme project.
spec:
  owner: group:default/acme-owners
  domain: acme
---
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: acme-shop-api
  title: shop/api
  annotations:
    platform.thesoftwaregeek.com/component-type: webservice
spec:
  type: service
  lifecycle: production
  owner: group:default/acme-owners
  system: acme-shop
  dependsOn:
    - resource:default/acme-shop-db
---
apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: acme-shop-db
  title: shop/db
  annotations:
    platform.thesoftwaregeek.com/component-type: database
spec:
  type: database
  owner: group:default/acme-owners
  system: acme-shop
